name: Incremental Sefaria to Otzaria ZIP

# Compare historical and current blacklists, then export the Sefaria books that
# changed from blocked to allowed. This workflow never builds or downloads a DB.

on:
  workflow_dispatch:
    inputs:
      blacklist_base_ref:
        description: Git commit/ref containing the historical blacklists
        required: true
        default: 5c19269040d8ccd29ef0820b4308a6ef4de9f3a4
        type: string
      retention_days:
        description: Number of days to retain the generated artifact
        required: false
        default: 30
        type: number

permissions:
  contents: read

concurrency:
  group: seforim-incremental-otzaria-zip
  cancel-in-progress: false

jobs:
  export:
    name: Compare blacklists and export Otzaria ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx1g -Dkotlin.compiler.execution.strategy=in-process

    steps:
      - name: Checkout SeforimLibrary
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip
          chmod +x gradlew

      - name: Prepare historical blacklists
        id: versions
        run: |
          set -euo pipefail
          BASE_REF='${{ inputs.blacklist_base_ref }}'
          git cat-file -e "$BASE_REF^{commit}"
          mkdir -p build
          git show "$BASE_REF:generator/sefariasqlite/src/jvmMain/resources/authors_blacklist.txt" \
            > build/baseline-authors-blacklist.txt
          git show "$BASE_REF:generator/sefariasqlite/src/jvmMain/resources/books_blacklist.txt" \
            > build/baseline-books-blacklist.txt
          test -s build/baseline-authors-blacklist.txt
          test -s build/baseline-books-blacklist.txt
          ARTIFACT_NAME="sefaria-otzaria-blacklist-delta-$(date -u +'%Y%m%d%H%M%S')"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Export newly allowed Sefaria books in Otzaria format
        run: |
          ./gradlew :sefariasqlite:exportIncrementalSefariaOtzaria \
            -PbaselineAuthorsBlacklist="$PWD/build/baseline-authors-blacklist.txt" \
            -PbaselineBooksBlacklist="$PWD/build/baseline-books-blacklist.txt" \
            -PotzariaOutputDir="$PWD/build/incremental-sefaria-otzaria" \
            -PotzariaOutputZip="$PWD/build/incremental-sefaria-otzaria.zip" \
            -PgeneratorHeap=5g \
            --no-daemon --stacktrace

      - name: Validate Otzaria ZIP
        run: |
          set -euo pipefail
          ZIP=build/incremental-sefaria-otzaria.zip
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          TXT_COUNT=$(unzip -Z1 "$ZIP" | awk '/^אוצריא\/.*\.txt$/ { count++ } END { print count+0 }')
          LINK_COUNT=$(unzip -Z1 "$ZIP" | awk '/^links\/.*_links\.json$/ { count++ } END { print count+0 }')
          # Info-ZIP can render UTF-8 Hebrew entry names through a legacy code
          # page. Count the generated source tree instead of trusting that
          # rendered listing, and require every text to be inside a category.
          ROOT=build/incremental-sefaria-otzaria
          test -s "$ROOT/metadata.json"
          test -s "$ROOT/files_manifest.json"
          TEXT_ROOT=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d ! -name links -print -quit)
          test -n "$TEXT_ROOT" || { echo "::error::Otzaria text root is missing."; exit 1; }
          TXT_COUNT=$(find "$TEXT_ROOT" -mindepth 2 -type f -name '*.txt' | wc -l)
          ROOT_TEXT_COUNT=$(find "$TEXT_ROOT" -maxdepth 1 -type f -name '*.txt' | wc -l)
          if [ -d "$ROOT/links" ]; then
            LINK_COUNT=$(find "$ROOT/links" -type f -name '*_links.json' | wc -l)
          else
            LINK_COUNT=0
          fi
          test "$TXT_COUNT" -gt 0 || { echo "::error::No newly allowed Sefaria books were found."; exit 1; }
          test "$ROOT_TEXT_COUNT" -eq 0 || { echo "::error::Some books were not placed in category folders."; exit 1; }
          echo "Exported books=$TXT_COUNT link-files=$LINK_COUNT"

      - name: Upload Otzaria ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.artifact_name }}
          path: build/incremental-sefaria-otzaria.zip
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
