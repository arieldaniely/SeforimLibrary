name: Incremental Sefaria to Otzaria ZIP

# Read the latest published database as a baseline, then export only Sefaria
# books allowed by the current blacklists and absent from that baseline.
# The seed DB is opened read-only; this workflow never builds or modifies a DB.

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository that owns the seed database release
        required: true
        default: kdroidFilter/SeforimLibrary
        type: string
      source_tag:
        description: Seed release tag (empty means latest stable release)
        required: false
        default: ""
        type: string
      retention_days:
        description: Number of days to retain the generated artifact
        required: false
        default: 30
        type: number
      include_copyright_books:
        description: Also build a supplemental Otzaria ZIP for Hebrew books missing from the bulk export (including Copyright versions)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: seforim-incremental-otzaria-zip
  cancel-in-progress: false

jobs:
  export:
    name: Compare seed and export Otzaria ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SEED_REPOSITORY: ${{ inputs.source_repository }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx1g -Dkotlin.compiler.execution.strategy=in-process

    steps:
      - name: Checkout SeforimLibrary
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq unzip zstd
          chmod +x gradlew

      - name: Resolve seed version
        id: versions
        run: |
          set -euo pipefail
          SEED_TAG='${{ inputs.source_tag }}'
          if [ -z "$SEED_TAG" ]; then
            SEED_TAG=$(gh release view --repo "$SEED_REPOSITORY" --json tagName --jq .tagName)
          fi
          if [[ "$SEED_TAG" =~ ^v([0-9]+)- ]]; then
            NEXT_VERSION=$((${BASH_REMATCH[1]} + 1))
          else
            echo "::error::Seed tag '$SEED_TAG' does not match v<dbVersion>-<timestamp>."
            exit 1
          fi
          ARTIFACT_NAME="sefaria-otzaria-v${NEXT_VERSION}-$(date -u +'%Y%m%d%H%M%S')"
          echo "seed_tag=$SEED_TAG" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download read-only seed database
        run: |
          set -euo pipefail
          mkdir -p seed-assets seed-extract build
          gh release download '${{ steps.versions.outputs.seed_tag }}' \
            --repo "$SEED_REPOSITORY" \
            --pattern 'seforim_bundle.tar.zst.part*' \
            --pattern 'seforim.db.buildstate' \
            --dir seed-assets
          test -s seed-assets/seforim.db.buildstate
          cat seed-assets/seforim_bundle.tar.zst.part* > seed-assets/seforim_bundle.tar.zst
          tar --use-compress-program=unzstd -xf seed-assets/seforim_bundle.tar.zst -C seed-extract
          test -s seed-extract/seforim.db
          mv seed-extract/seforim.db build/seed-seforim.db
          mv seed-assets/seforim.db.buildstate build/seed-seforim.db.buildstate
          rm -rf seed-assets seed-extract
          ls -lh build/seed-seforim.db build/seed-seforim.db.buildstate

      - name: Export missing Sefaria books in Otzaria format
        run: |
          ./gradlew :sefariasqlite:exportIncrementalSefariaOtzaria \
            -PseedDb="$PWD/build/seed-seforim.db" \
            -PotzariaOutputDir="$PWD/build/incremental-sefaria-otzaria" \
            -PotzariaOutputZip="$PWD/build/incremental-sefaria-otzaria.zip" \
            -PincrementalReport="$PWD/build/incremental-sefaria-report.json" \
            -PgeneratorHeap=5g \
            --no-daemon --stacktrace

      - name: Build missing Hebrew books report
        id: supplemental_report
        run: |
          python3 .github/scripts/build-sefaria-copyright-report.py \
            --input build/incremental-sefaria-report.json \
            --output build/supplemental-hebrew-titles.json \
            --status build/supplemental-report-status.json \
            --workers 8
          echo "count=$(jq 'length' build/supplemental-hebrew-titles.json)" >> "$GITHUB_OUTPUT"

      - name: Download supplemental Hebrew books and outbound links
        if: ${{ inputs.include_copyright_books && steps.supplemental_report.outputs.count != '0' }}
        run: |
          python3 .github/scripts/download-sefaria-copyright-export.py \
            --report build/supplemental-hebrew-titles.json \
            --export-root build/sefaria/export \
            --manifest build/supplemental-merged-files.txt \
            --links build/supplemental-api-links.json \
            --status build/supplemental-download-status.json \
            --books-blacklist generator/sefariasqlite/src/jvmMain/resources/books_blacklist.txt \
            --authors-blacklist generator/sefariasqlite/src/jvmMain/resources/authors_blacklist.txt \
            --workers 2

      - name: Upload supplemental download diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.artifact_name }}-supplemental-download-diagnostics
          path: |
            build/supplemental-hebrew-titles.json
            build/supplemental-report-status.json
            build/supplemental-download-status.json
            build/supplemental-merged-files.txt
            build/supplemental-api-links.json
            build/supplemental-otzaria-report.json
            build/supplemental-import-validation.json
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

      - name: Export supplemental Hebrew books as a separate Otzaria ZIP
        if: ${{ inputs.include_copyright_books && steps.supplemental_report.outputs.count != '0' }}
        run: |
          ./gradlew :sefariasqlite:exportIncrementalSefariaOtzaria \
            -PseedDb="$PWD/build/seed-seforim.db" \
            -PexportDir="$PWD/build/sefaria/export" \
            -PmergedFilesList="$PWD/build/supplemental-merged-files.txt" \
            -PapiLinksPath="$PWD/build/supplemental-api-links.json" \
            -PreportSource="Sefaria API supplemental Hebrew versions" \
            -PotzariaOutputDir="$PWD/build/supplemental-sefaria-otzaria" \
            -PotzariaOutputZip="$PWD/build/supplemental-sefaria-otzaria.zip" \
            -PincrementalReport="$PWD/build/supplemental-otzaria-report.json" \
            -PgeneratorHeap=5g \
            --no-daemon --stacktrace

      - name: Validate supplemental Hebrew Otzaria ZIP
        if: ${{ inputs.include_copyright_books && steps.supplemental_report.outputs.count != '0' }}
        run: |
          set -euo pipefail
          ZIP=build/supplemental-sefaria-otzaria.zip
          ROOT=build/supplemental-sefaria-otzaria
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          test -s "$ROOT/metadata.json"
          test -s "$ROOT/files_manifest.json"
          EXPORTED=$(jq '.exportedBooks' build/supplemental-otzaria-report.json)
          LINKS=$(jq '.exportedLinks' build/supplemental-otzaria-report.json)
          TXT_COUNT=$(find "$ROOT/אוצריא" -type f -name '*.txt' | wc -l)
          test "$EXPORTED" -gt 0
          test "$TXT_COUNT" -eq "$EXPORTED"
          COPYRIGHT_COUNT=$(jq '[.[] | select(.copyrightOnly == true)] | length' build/supplemental-hebrew-titles.json)
          if [ "$COPYRIGHT_COUNT" -gt 0 ]; then
            test "$LINKS" -gt 0 || { echo "::error::Supplemental ZIP contains Copyright books but no outbound links."; exit 1; }
          fi
          echo "Supplemental ZIP: books=$EXPORTED links=$LINKS"

      - name: Verify supplemental ZIP with the Otzaria database importer
        if: ${{ inputs.include_copyright_books && steps.supplemental_report.outputs.count != '0' }}
        run: |
          set -euo pipefail
          VALIDATION_DB=build/supplemental-import-validation.db
          VALIDATION_STATE=build/supplemental-import-validation.db.buildstate
          cp --reflink=auto build/seed-seforim.db "$VALIDATION_DB"
          cp build/seed-seforim.db.buildstate "$VALIDATION_STATE"
          BEFORE=$(sqlite3 "$VALIDATION_DB" 'SELECT COUNT(*) FROM book;')
          EXPECTED=$(jq '.exportedBooks' build/supplemental-otzaria-report.json)
          ./gradlew :otzariasqlite:appendOtzaria \
            -PseforimDb="$PWD/$VALIDATION_DB" \
            -PsourceDir="$PWD/build/supplemental-sefaria-otzaria" \
            -PnewBookIdsFile="$PWD/build/supplemental-validation-book-ids.txt" \
            -PbuildStatePath="$PWD/$VALIDATION_STATE" \
            -PinMemoryDb=false \
            -PgeneratorHeap=5g \
            --no-daemon --stacktrace
          AFTER=$(sqlite3 "$VALIDATION_DB" 'SELECT COUNT(*) FROM book;')
          ADDED=$((AFTER-BEFORE))
          IDS_FILE=build/supplemental-validation-book-ids.txt
          IMPORTED_IDS=$(grep -cve '^[[:space:]]*$' "$IDS_FILE" || true)
          if grep -Ev '^[[:space:]]*$|^[0-9]+$' "$IDS_FILE" | grep -q .; then
            echo "::error::Importer IDs file contains a non-numeric value."
            exit 1
          fi
          UNIQUE_IMPORTED_IDS=$(awk '/^[0-9]+$/ { print }' "$IDS_FILE" | sort -nu | wc -l)
          IDS_CSV=$(awk '/^[0-9]+$/ { print }' "$IDS_FILE" | sort -nu | paste -sd, -)
          COLLIDING_SEED_IDS=0
          if [ -n "$IDS_CSV" ]; then
            COLLIDING_SEED_IDS=$(sqlite3 build/seed-seforim.db "SELECT COUNT(*) FROM book WHERE id IN ($IDS_CSV);")
          fi
          STATE_SHA256=$(sha256sum build/seed-seforim.db.buildstate | cut -d' ' -f1)
          if [ "$ADDED" -ne "$EXPECTED" ] || \
             [ "$IMPORTED_IDS" -ne "$EXPECTED" ] || \
             [ "$UNIQUE_IMPORTED_IDS" -ne "$EXPECTED" ] || \
             [ "$COLLIDING_SEED_IDS" -ne 0 ]; then
            jq -n \
              --argjson expectedBooks "$EXPECTED" \
              --argjson addedBooks "$ADDED" \
              --argjson importerIds "$IMPORTED_IDS" \
              --argjson uniqueImporterIds "$UNIQUE_IMPORTED_IDS" \
              --argjson collidingSeedIds "$COLLIDING_SEED_IDS" \
              --arg buildStateSha256 "$STATE_SHA256" \
              '{verified: false, expectedBooks: $expectedBooks, addedBooks: $addedBooks, importerIds: $importerIds, uniqueImporterIds: $uniqueImporterIds, collidingSeedIds: $collidingSeedIds, outboundLinksToSeed: 0, buildStateSha256: $buildStateSha256, error: "import count or stable-ID validation failed"}' \
              > build/supplemental-import-validation.json
            echo "::error::Supplemental import mismatch: exported=$EXPECTED added=$ADDED importer-ids=$IMPORTED_IDS unique-ids=$UNIQUE_IMPORTED_IDS ids-already-in-seed=$COLLIDING_SEED_IDS."
            exit 1
          fi
          OUTBOUND=$(sqlite3 "$VALIDATION_DB" \
            "ATTACH DATABASE '$PWD/build/seed-seforim.db' AS seed; \
             SELECT COUNT(*) FROM link l \
             WHERE NOT EXISTS (SELECT 1 FROM seed.book b WHERE b.id=l.sourceBookId) \
               AND EXISTS (SELECT 1 FROM seed.book b WHERE b.id=l.targetBookId);")
          COPYRIGHT_COUNT=$(jq '[.[] | select(.copyrightOnly == true)] | length' build/supplemental-hebrew-titles.json)
          if [ "$COPYRIGHT_COUNT" -gt 0 ]; then
            test "$OUTBOUND" -gt 0 || { echo "::error::Importer created no links from supplemental Copyright books to seed books."; exit 1; }
          fi
          jq -n \
            --argjson expectedBooks "$EXPECTED" \
            --argjson added "$ADDED" \
            --argjson importerIds "$IMPORTED_IDS" \
            --argjson uniqueImporterIds "$UNIQUE_IMPORTED_IDS" \
            --argjson outboundLinksToSeed "$OUTBOUND" \
            --arg buildStateSha256 "$STATE_SHA256" \
            '{verified: true, expectedBooks: $expectedBooks, addedBooks: $added, importerIds: $importerIds, uniqueImporterIds: $uniqueImporterIds, collidingSeedIds: 0, outboundLinksToSeed: $outboundLinksToSeed, buildStateSha256: $buildStateSha256}' \
            > build/supplemental-import-validation.json
          echo "Otzaria importer verified: added=$ADDED outbound-links-to-seed=$OUTBOUND"
          rm -f "$VALIDATION_DB" "$VALIDATION_STATE"

      - name: Validate Otzaria ZIP
        run: |
          set -euo pipefail
          ZIP=build/incremental-sefaria-otzaria.zip
          test -s "$ZIP"
          unzip -t "$ZIP" >/dev/null
          TXT_COUNT=$(unzip -Z1 "$ZIP" | awk '/^אוצריא\/.*\.txt$/ { count++ } END { print count+0 }')
          LINK_COUNT=$(unzip -Z1 "$ZIP" | awk '/^links\/.*_links\.json$/ { count++ } END { print count+0 }')
          # Info-ZIP can render UTF-8 Hebrew entry names through a legacy code
          # page. Count the generated source tree instead of trusting that
          # rendered listing, and require every text to be inside a category.
          ROOT=build/incremental-sefaria-otzaria
          test -s "$ROOT/metadata.json"
          test -s "$ROOT/files_manifest.json"
          TEXT_ROOT=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d ! -name links -print -quit)
          test -n "$TEXT_ROOT" || { echo "::error::Otzaria text root is missing."; exit 1; }
          TXT_COUNT=$(find "$TEXT_ROOT" -mindepth 2 -type f -name '*.txt' | wc -l)
          ROOT_TEXT_COUNT=$(find "$TEXT_ROOT" -maxdepth 1 -type f -name '*.txt' | wc -l)
          if [ -d "$ROOT/links" ]; then
            LINK_COUNT=$(find "$ROOT/links" -type f -name '*_links.json' | wc -l)
          else
            LINK_COUNT=0
          fi
          test "$TXT_COUNT" -gt 0 || { echo "::error::No newly allowed Sefaria books were found."; exit 1; }
          test "$ROOT_TEXT_COUNT" -eq 0 || { echo "::error::Some books were not placed in category folders."; exit 1; }
          echo "Exported books=$TXT_COUNT link-files=$LINK_COUNT"
          unzip -l "$ZIP" | tail -n 20

      - name: Upload Otzaria ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.artifact_name }}
          path: |
            build/incremental-sefaria-otzaria.zip
            build/incremental-sefaria-report.json
            build/supplemental-hebrew-titles.json
            build/supplemental-report-status.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload supplemental Hebrew Otzaria ZIP artifact
        if: ${{ inputs.include_copyright_books && steps.supplemental_report.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.artifact_name }}-supplemental
          path: |
            build/supplemental-sefaria-otzaria.zip
            build/supplemental-hebrew-titles.json
            build/supplemental-download-status.json
            build/supplemental-otzaria-report.json
            build/supplemental-import-validation.json
            build/supplemental-report-status.json
            build/supplemental-merged-files.txt
            build/supplemental-api-links.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: Upload final supplemental validation diagnostics
        if: ${{ always() && inputs.include_copyright_books }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.artifact_name }}-supplemental-validation-diagnostics
          path: |
            build/supplemental-hebrew-titles.json
            build/supplemental-report-status.json
            build/supplemental-download-status.json
            build/supplemental-otzaria-report.json
            build/supplemental-import-validation.json
            build/supplemental-validation-book-ids.txt
            build/supplemental-merged-files.txt
            build/supplemental-api-links.json
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

      - name: Write ZIP export summary
        if: ${{ always() }}
        shell: bash
        run: |
          bash .github/scripts/write-otzaria-zip-summary.sh \
            build/incremental-sefaria-report.json \
            build/supplemental-hebrew-titles.json \
            build/supplemental-report-status.json \
            build/supplemental-download-status.json \
            build/supplemental-otzaria-report.json \
            build/supplemental-import-validation.json \
            '${{ steps.versions.outputs.seed_tag }}' \
            '${{ steps.versions.outputs.artifact_name }}' \
            '${{ inputs.include_copyright_books }}'
