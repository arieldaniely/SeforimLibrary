name: Build Portable Seforim Importer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "generator/importer-app/**"
      - "generator/otzariasqlite/**"
      - "generator/catalog/**"
      - "generator/searchindex/**"
      - "generator/common/**"
      - "core/**"
      - "dao/**"
      - "buildSrc/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-portable-importer.yml"
  pull_request:
    paths:
      - "generator/importer-app/**"
      - "generator/otzariasqlite/**"
      - "generator/catalog/**"
      - "generator/searchindex/**"
      - "generator/common/**"
      - "core/**"
      - "dao/**"
      - "buildSrc/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-portable-importer.yml"

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build portable ZIP
        shell: pwsh
        run: ./gradlew.bat :importer-app:jvmTest :importer-app:packagePortableZip --no-daemon

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: seforim-importer-windows-x64
          path: generator/importer-app/build/distributions/seforim-importer-windows-x64-*.zip
          if-no-files-found: error
          retention-days: 14
